---
name: Publish
on:
  push:
    branches:
      - main
    tags:
      - v*
defaults:
  run:
    shell: bash
permissions: {}
jobs:
  publishProtos:
    name: Publish Protobufs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Push to BSR
        uses: cerbos/actions/buf@7df6503218a73e5022cc801e99574380474c97dd # main
        with:
          token: ${{ secrets.BUF_TOKEN }}
